# Amlogic S905L3A / G12A quad core 2GB RAM SoC eMMC GBE USB3 SPI
BOARD_NAME="Yandex Station Max"
BOARD_VENDOR="leftymods"
BOARDFAMILY="meson-g12a"
BOARD_MAINTAINER="leftymods"
INTRODUCED="2020"
VENDOR="AtriOS"
VENDORURL="https://github.com/leftymods/CoreOS"
VENDORSUPPORT="https://github.com/leftymods/CoreOS"
VENDORDOCS="https://github.com/leftymods/CoreOS"
VENDORBUGS="https://github.com/leftymods/CoreOS"
MAINTAINERMAIL="leftymods@users.noreply.github.com"
BOOTCONFIG="atristation_defconfig"
KERNEL_TARGET="current"
BOOT_FDT_FILE="amlogic/meson-g12a-yandex-station-max.dtb"
MODULES_BLACKLIST="simpledrm" # SimpleDRM conflicts with Panfrost
FULL_DESKTOP="yes"
SERIALCON="ttyAML0"
BOOT_LOGO="yes"
IMAGE_VERSION=""
RELEASE_ALIAS="Nebula"

# WiFi/Bluetooth packages
PACKAGE_LIST_BOARD="evtest kmod rfkill iw usbutils file bluez bluetooth rfkill wpasupplicant iwd wireless-tools network-manager i2c-tools firmware-realtek firmware-misc-nonfree v4l-utils plymouth plymouth-themes"

# Enable SY6045S, ES8156, Zigbee, Rotary, Gowin screen, LTR308ALS
KERNEL_CONFIGURE_OPTS+=" custom_kernel_config__enable_sy6045s"
# Disable unused SoC families, unused wlan drivers, and DWARF debug info to speed up build
KERNEL_CONFIGURE_OPTS+=" custom_kernel_config__disable_unused_arches"
# Enable rtw88 debugfs for RTL8822CS diagnostics
KERNEL_CONFIGURE_OPTS+=" custom_kernel_config__enable_rtw88_debugfs"

enable_extension apt-ipv4
enable_extension atrisound
enable_extension atri-main

# AtriOS Adaptive Brightness Configuration
# Controls LED Matrix and RGB Ring brightness using LTR-308ALS sensor

[autobrightness]
# Enable adaptive auto-brightness regulator (1 = on, 0 = off)
enabled=1

# Complete shutoff when in darkness (1 = turn off matrix and ring when lux < darkness_lux)
darkness_auto_off=1

# Threshold in Lux for total darkness (e.g. night/sleep mode)
darkness_lux=2.0

# LED Matrix brightness bounds (range: 0 to 200)
min_matrix=5
max_matrix=200

# RGB Ring brightness bounds (range: 0 to 100 percent)
min_ring=5
max_ring=100

# Sampling & regulation interval in milliseconds
poll_interval_ms=1000

# Exponential Moving Average smoothing factor (0.05 = slow/gentle, 0.5 = fast)
smooth_alpha=0.25

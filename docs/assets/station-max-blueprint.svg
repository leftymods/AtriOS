<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching reference #3 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1118" />
      <stop offset="50%" stop-color="#0a0d13" />
      <stop offset="100%" stop-color="#06080c" />
    </linearGradient>

    <!-- Top Halo Violet/Purple Glow Filter -->
    <filter id="haloGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Front LED Matrix Glow Filter -->
    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Halo Purple Radial Gradient -->
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0" />
      <stop offset="90%" stop-color="#c084fc" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.95" />
    </radialGradient>

    <!-- Shading for Left & Right Body Faces (Blueprint aesthetic) -->
    <linearGradient id="leftFaceShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121622" />
      <stop offset="100%" stop-color="#0b0e16" />
    </linearGradient>

    <linearGradient id="rightFaceShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f131c" />
      <stop offset="100%" stop-color="#080a0f" />
    </linearGradient>

    <linearGradient id="topPlateShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b28" />
      <stop offset="100%" stop-color="#10141e" />
    </linearGradient>
  </defs>

  <!-- Deep Blueprint Canvas Background -->
  <rect width="900" height="1100" fill="url(#bgGradient)" />

  <!-- Subtle Blueprint Tech Grid / Ambient Floor -->
  <g opacity="0.12" stroke="#4f5975" stroke-width="0.75">
    <line x1="100" y1="920" x2="800" y2="520" />
    <line x1="200" y1="980" x2="900" y2="580" />
    <line x1="800" y1="920" x2="100" y2="520" />
    <line x1="700" y1="980" x2="0" y2="580" />
    <ellipse cx="450" cy="880" rx="340" ry="140" fill="none" stroke="#606c8c" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- ======================================================== -->
  <!-- MAIN STATION MONOLITHIC BODY (ISOMETRIC 3D)              -->
  <!-- ======================================================== -->
  <g id="station-body">
    <!-- Left Face (Front-Facing) Solid Fill -->
    <path d="M 190,340 
             L 450,490 
             L 450,850 
             Q 450,880 420,865 
             L 210,745 
             Q 190,735 190,710 
             Z" 
          fill="url(#leftFaceShade)" />

    <!-- Right Face (Rear/Side-Facing) Solid Fill -->
    <path d="M 450,490 
             L 710,340 
             Q 730,330 730,355 
             L 730,710 
             Q 730,735 710,745 
             L 480,865 
             Q 450,880 450,850 
             Z" 
          fill="url(#rightFaceShade)" />

    <!-- Outer Structural Blueprint Outlines (Reference #3 exact lines) -->
    <!-- Front Center Vertical Ridge -->
    <line x1="450" y1="490" x2="450" y2="865" stroke="#7e88a3" stroke-width="2" stroke-linecap="round" />

    <!-- Left Outer Vertical Contour -->
    <path d="M 190,340 L 190,715 Q 190,745 220,760 L 450,875 Q 450,875 480,860 L 710,745 Q 730,735 730,715 L 730,340" 
          fill="none" 
          stroke="#8c97b5" 
          stroke-width="2.5" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Secondary Soft Offset Line on Left Front (Stylized Blueprint Outline) -->
    <path d="M 202,352 L 202,705 Q 202,728 226,742 L 442,852" 
          fill="none" 
          stroke="#424c66" 
          stroke-width="1.2" 
          stroke-linecap="round" />

    <!-- Top Cap Bevel Profile -->
    <path d="M 450,190 
             Q 470,180 500,195 
             L 710,315 
             Q 730,325 730,345 
             Q 730,365 710,375 
             L 480,495 
             Q 450,510 420,495 
             L 210,375 
             Q 190,365 190,345 
             Q 190,325 210,315 
             L 400,195 
             Q 430,180 450,190 Z" 
          fill="url(#topPlateShade)" 
          stroke="#9aa4bf" 
          stroke-width="2.5" 
          stroke-linejoin="round" />

    <!-- Inner Top Plate Recess Rim -->
    <path d="M 450,210 
             L 695,340 
             L 450,470 
             L 205,340 Z" 
          fill="none" 
          stroke="#55607a" 
          stroke-width="1.6" 
          stroke-linejoin="round" />

    <!-- Top-Left Brand Logo "Яндекс" / "AtriOS" in Perspective -->
    <g transform="translate(265, 275) rotate(-30) skewX(30) scale(0.9)" opacity="0.85">
      <text x="0" y="0" 
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="16" 
            font-weight="700" 
            fill="#a6b0cc" 
            letter-spacing="0.5">Яндекс</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- REAR HEATSINK FINS / RADIATOR (Right Flank from Ref #3) -->
  <!-- ======================================================== -->
  <g id="heatsink-fins" stroke="#7e88a3" stroke-width="1.8" stroke-linecap="round">
    <!-- Back Plate Inset Frame -->
    <path d="M 570,410 L 690,345 L 690,710 L 570,765 Z" fill="#080a0f" opacity="0.4" stroke="none" />

    <!-- Vertical Radiator Slits (11 Parallel Cooling Fins) -->
    <line x1="575" y1="412" x2="575" y2="760" />
    <line x1="586" y1="406" x2="586" y2="754" />
    <line x1="597" y1="400" x2="597" y2="748" />
    <line x1="608" y1="394" x2="608" y2="742" />
    <line x1="619" y1="388" x2="619" y2="736" />
    <line x1="630" y1="382" x2="630" y2="730" />
    <line x1="641" y1="376" x2="641" y2="724" />
    <line x1="652" y1="370" x2="652" y2="718" />
    <line x1="663" y1="364" x2="663" y2="712" />
    <line x1="674" y1="358" x2="674" y2="706" />
    <line x1="685" y1="352" x2="685" y2="700" />
  </g>

  <!-- ======================================================== -->
  <!-- REAR I/O PORT BAY (Bottom Right Section from Ref #3)     -->
  <!-- ======================================================== -->
  <g id="io-ports">
    <!-- Port Cutout Cavity Frame -->
    <path d="M 590,740 L 700,680 L 700,770 L 590,820 Z" fill="#06070a" stroke="#4d5770" stroke-width="1.5" />

    <!-- HDMI OUT Connector (Trapezoid Blueprint Shape) -->
    <g transform="translate(630, 725) skewY(-28) scale(0.9)">
      <polygon points="2,2 26,2 24,14 4,14" fill="#0a0d13" stroke="#8c97b5" stroke-width="1.6" />
      <line x1="7" y1="7" x2="21" y2="7" stroke="#8c97b5" stroke-width="1.2" />
    </g>

    <!-- Gigabit Ethernet (RJ45) Port with Gold Clip Notch -->
    <g transform="translate(640, 765) skewY(-28) scale(0.9)">
      <rect x="0" y="0" width="28" height="24" rx="2" fill="#090c12" stroke="#8c97b5" stroke-width="1.6" />
      <polygon points="8,4 20,4 20,12 23,12 23,19 5,19 5,12 8,12" fill="#040507" stroke="#707a94" stroke-width="1" />
      <!-- Ethernet Pin Lines -->
      <line x1="9" y1="7" x2="9" y2="10" stroke="#f59e0b" stroke-width="1" />
      <line x1="12" y1="7" x2="12" y2="10" stroke="#f59e0b" stroke-width="1" />
      <line x1="15" y1="7" x2="15" y2="10" stroke="#f59e0b" stroke-width="1" />
      <line x1="18" y1="7" x2="18" y2="10" stroke="#f59e0b" stroke-width="1" />
    </g>

    <!-- 3.5mm AUX Audio Output Jack (Circle) -->
    <g transform="translate(615, 788)">
      <ellipse cx="0" cy="0" rx="6" ry="4" fill="#07090d" stroke="#8c97b5" stroke-width="1.6" />
      <ellipse cx="0" cy="0" rx="3" ry="2" fill="#000000" stroke="#505a73" stroke-width="1" />
    </g>

    <!-- DC Power Jack & Connected Plug Cable (Exact Ref #3 Detail) -->
    <g id="power-cable">
      <!-- DC Socket Collar on Chassis -->
      <ellipse cx="690" cy="745" rx="8" ry="12" fill="#0a0d13" stroke="#8c97b5" stroke-width="1.8" />
      
      <!-- Power Barrel Plug Strain Relief Body -->
      <path d="M 688,738 
               L 720,754 
               Q 728,758 726,766 
               L 722,772 
               Q 720,778 712,774 
               L 688,756 Z" 
            fill="#161a26" 
            stroke="#9aa4bf" 
            stroke-width="2" 
            stroke-linejoin="round" />

      <!-- Plug Grip Rings -->
      <line x1="702" y1="746" x2="700" y2="762" stroke="#6b7691" stroke-width="1.5" />
      <line x1="710" y1="750" x2="708" y2="766" stroke="#6b7691" stroke-width="1.5" />

      <!-- Heavy Gauge DC Power Cord (Extending Smoothly to Lower Right) -->
      <path d="M 724,769 
               C 760,788 800,830 870,890" 
            fill="none" 
            stroke="#8c97b5" 
            stroke-width="5" 
            stroke-linecap="round" />
      <!-- Cable Inner Core Highlight -->
      <path d="M 724,769 
               C 760,788 800,830 870,890" 
            fill="none" 
            stroke="#c4ccde" 
            stroke-width="1.5" 
            stroke-linecap="round" 
            opacity="0.6" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- ROTARY VOLUME WHEEL & VIOLET HALO RING (Top Dial)       -->
  <!-- ======================================================== -->
  <g id="volume-knob">
    <!-- Ambient Violet/Purple Glowing Halo in Chamber (Ref #2 + #3) -->
    <ellipse cx="450" cy="340" rx="142" ry="82" fill="url(#haloGrad)" filter="url(#haloGlow)" opacity="0.95" />
    <ellipse cx="450" cy="340" rx="138" ry="80" fill="none" stroke="#d8b4fe" stroke-width="2" opacity="0.8" />

    <!-- Outer Knob Base Ring Contour -->
    <path d="M 315,340 
             A 135,78 0 0,0 585,340 
             L 585,322 
             A 135,78 0 0,0 315,322 
             Z" 
          fill="#131722" 
          stroke="#7e88a3" 
          stroke-width="2" 
          stroke-linejoin="round" />

    <!-- Rotary Dial Cylinder Wall (Cylindrical Height = 18px) -->
    <path d="M 325,335 
             A 125,72 0 0,0 575,335 
             L 575,317 
             A 125,72 0 0,0 325,317 
             Z" 
          fill="#1b202e" 
          stroke="#9aa4bf" 
          stroke-width="2.2" />

    <!-- Dial Cylinder Vertical Edge Lines -->
    <line x1="325" y1="317" x2="325" y2="335" stroke="#9aa4bf" stroke-width="2.2" />
    <line x1="575" y1="317" x2="575" y2="335" stroke="#9aa4bf" stroke-width="2.2" />

    <!-- Dial Top Surface (Matte Disc) -->
    <ellipse cx="450" cy="317" rx="125" ry="72" fill="#141824" stroke="#aab3cc" stroke-width="2.2" />
    <ellipse cx="450" cy="317" rx="116" ry="67" fill="none" stroke="#48526b" stroke-width="1.2" />

    <!-- Circular Array of 48 Microphone Array Pinhole Dots (Exact Ref #3) -->
    <g id="mic-array-holes" fill="#8c97b5">
      <!-- Calculated isometric ellipse positions (rx=108, ry=62) -->
      <circle cx="558" cy="317" r="1.5" />
      <circle cx="556" cy="325" r="1.5" /><circle cx="550" cy="333" r="1.5" />
      <circle cx="541" cy="341" r="1.5" /><circle cx="528" cy="348" r="1.5" />
      <circle cx="513" cy="354" r="1.5" /><circle cx="496" cy="361" r="1.5" />
      <circle cx="477" cy="366" r="1.5" /><circle cx="457" cy="370" r="1.5" />
      <circle cx="437" cy="371" r="1.5" /><circle cx="417" cy="370" r="1.5" />
      <circle cx="398" cy="367" r="1.5" /><circle cx="380" cy="362" r="1.5" />
      <circle cx="364" cy="356" r="1.5" /><circle cx="350" cy="349" r="1.5" />
      <circle cx="339" cy="341" r="1.5" /><circle cx="333" cy="333" r="1.5" />
      <circle cx="331" cy="325" r="1.5" /><circle cx="333" cy="317" r="1.5" />
      <circle cx="338" cy="309" r="1.5" /><circle cx="347" cy="301" r="1.5" />
      <circle cx="359" cy="294" r="1.5" /><circle cx="374" cy="287" r="1.5" />
      <circle cx="392" cy="281" r="1.5" /><circle cx="411" cy="276" r="1.5" />
      <circle cx="431" cy="272" r="1.5" /><circle cx="451" cy="270" r="1.5" />
      <circle cx="471" cy="270" r="1.5" /><circle cx="491" cy="272" r="1.5" />
      <circle cx="510" cy="276" r="1.5" /><circle cx="527" cy="281" r="1.5" />
      <circle cx="542" cy="288" r="1.5" /><circle cx="553" cy="296" r="1.5" />
      <circle cx="559" cy="304" r="1.5" /><circle cx="560" cy="312" r="1.5" />
    </g>

    <!-- Center Far-Field Mic Pinhole -->
    <circle cx="450" cy="317" r="2.2" fill="#000000" stroke="#717c99" stroke-width="1" />

    <!-- Button 1 (Left): Microphone Mute Icon with Slash (Ref #3) -->
    <g transform="translate(385, 318)" stroke="#a6b0cc" stroke-linecap="round" stroke-linejoin="round">
      <!-- Outer Button Touch Circle in Isometric -->
      <ellipse cx="0" cy="0" rx="15" ry="9" fill="#1b202f" stroke="#8c97b5" stroke-width="1.4" />
      <!-- Mic Body Contour -->
      <rect x="-3" y="-5" width="6" height="7" rx="3" fill="none" stroke="#d5dbe8" stroke-width="1.1" />
      <!-- Mic Stand Arc -->
      <path d="M -5,-1 Q -5,5 0,5 Q 5,5 5,-1" fill="none" stroke="#d5dbe8" stroke-width="1" />
      <!-- Mic Base -->
      <line x1="0" y1="5" x2="0" y2="7" stroke="#d5dbe8" stroke-width="1" />
      <line x1="-3" y1="7" x2="3" y2="7" stroke="#d5dbe8" stroke-width="1" />
      <!-- Diagonal Mute Slash -->
      <line x1="-7" y1="5" x2="7" y2="-5" stroke="#ef4444" stroke-width="1.3" />
    </g>

    <!-- Button 2 (Right): Alice / Action Button (Double Concentric Ring) -->
    <g transform="translate(515, 318)">
      <ellipse cx="0" cy="0" rx="15" ry="9" fill="#1b202f" stroke="#8c97b5" stroke-width="1.4" />
      <ellipse cx="0" cy="0" rx="7" ry="4.2" fill="none" stroke="#d5dbe8" stroke-width="1.3" />
      <circle cx="0" cy="0" r="2" fill="#a855f7" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- FRONT 25x16 LED MATRIX DISPLAY (Equalizer / Waveform)   -->
  <!-- Glowing Monochromatic Waveform Pattern (Refs #1 & #2)    -->
  <!-- ======================================================== -->
  <g id="led-matrix-display" transform="translate(310, 620) skewY(30) scale(0.9, 1)" filter="url(#matrixGlow)">
    <!-- Equalizer / Waveform Columns Glowing Through Fabric -->
    <!-- Column 1 -->
    <circle cx="0" cy="50" r="3.2" fill="#e0e7ff" opacity="0.9" />
    <circle cx="0" cy="40" r="3.2" fill="#c7d2fe" opacity="0.8" />
    <circle cx="0" cy="30" r="3.2" fill="#a5b4fc" opacity="0.7" />

    <!-- Column 2 -->
    <circle cx="10" cy="50" r="3.2" fill="#e0e7ff" opacity="0.9" />
    <circle cx="10" cy="40" r="3.2" fill="#c7d2fe" opacity="0.8" />
    <circle cx="10" cy="30" r="3.2" fill="#a5b4fc" opacity="0.75" />
    <circle cx="10" cy="20" r="3.2" fill="#818cf8" opacity="0.7" />
    <circle cx="10" cy="10" r="3.2" fill="#6366f1" opacity="0.6" />

    <!-- Column 3 -->
    <circle cx="20" cy="50" r="3.2" fill="#e0e7ff" opacity="0.9" />
    <circle cx="20" cy="40" r="3.2" fill="#c7d2fe" opacity="0.8" />
    <circle cx="20" cy="30" r="3.2" fill="#a5b4fc" opacity="0.7" />

    <!-- Column 4 (Dip) -->
    <circle cx="30" cy="50" r="3.2" fill="#e0e7ff" opacity="0.8" />
    <circle cx="30" cy="40" r="3.2" fill="#c7d2fe" opacity="0.7" />

    <!-- Column 5 -->
    <circle cx="40" cy="50" r="3.2" fill="#e0e7ff" opacity="0.9" />
    <circle cx="40" cy="40" r="3.2" fill="#c7d2fe" opacity="0.8" />
    <circle cx="40" cy="30" r="3.2" fill="#a5b4fc" opacity="0.7" />
    <circle cx="40" cy="20" r="3.2" fill="#818cf8" opacity="0.65" />

    <!-- Column 6 (Tall Peak) -->
    <circle cx="50" cy="50" r="3.2" fill="#ffffff" opacity="1.0" />
    <circle cx="50" cy="40" r="3.2" fill="#e0e7ff" opacity="0.95" />
    <circle cx="50" cy="30" r="3.2" fill="#c7d2fe" opacity="0.9" />
    <circle cx="50" cy="20" r="3.2" fill="#a5b4fc" opacity="0.85" />
    <circle cx="50" cy="10" r="3.2" fill="#818cf8" opacity="0.75" />
    <circle cx="50" cy="0"  r="3.2" fill="#6366f1" opacity="0.65" />
    <circle cx="50" cy="-10" r="3"   fill="#4f46e5" opacity="0.55" />

    <!-- Column 7 -->
    <circle cx="60" cy="50" r="3.2" fill="#ffffff" opacity="1.0" />
    <circle cx="60" cy="40" r="3.2" fill="#e0e7ff" opacity="0.9" />
    <circle cx="60" cy="30" r="3.2" fill="#c7d2fe" opacity="0.85" />
    <circle cx="60" cy="20" r="3.2" fill="#a5b4fc" opacity="0.75" />
    <circle cx="60" cy="10" r="3.2" fill="#818cf8" opacity="0.65" />

    <!-- Column 8 (Mid-High Peak) -->
    <circle cx="70" cy="50" r="3.2" fill="#e0e7ff" opacity="0.9" />
    <circle cx="70" cy="40" r="3.2" fill="#c7d2fe" opacity="0.8" />
    <circle cx="70" cy="30" r="3.2" fill="#a5b4fc" opacity="0.7" />
    <circle cx="70" cy="20" r="3.2" fill="#818cf8" opacity="0.65" />
    <circle cx="70" cy="10" r="3.2" fill="#6366f1" opacity="0.5" />

    <!-- Column 9 -->
    <circle cx="80" cy="50" r="3.2" fill="#e0e7ff" opacity="0.8" />
    <circle cx="80" cy="40" r="3.2" fill="#c7d2fe" opacity="0.6" />
  </g>

  <!-- Technical Spec Label in Corner (Blueprint HUD) -->
  <g opacity="0.85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace">
    <rect x="50" y="50" width="260" height="60" rx="8" fill="rgba(16, 20, 30, 0.85)" stroke="#3e4760" stroke-width="1.2" />
    <text x="68" y="77" fill="#f1f5f9" font-size="14" font-weight="700" letter-spacing="1">YANDEX STATION MAX</text>
    <text x="68" y="96" fill="#818cf8" font-size="10" font-weight="600" letter-spacing="0.5">ISOMETRIC TECHNICAL BLUEPRINT</text>
  </g>
</svg>
